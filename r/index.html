<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dejanos tu reseña — Paladear</title>
<meta name="robots" content="noindex, follow">
<!-- Atajo para el QR del cartel del local.
     El link de resenas de Google es larguisimo (73 caracteres) y eso obliga a
     un QR de 37x37 modulos: cuadraditos chicos, dificiles de leer con poca luz.
     Desde aca son 25 caracteres y el QR baja a 29x29, con cuadraditos casi un
     50% mas grandes. Ademas, si algun dia cambia el link de Google, se cambia
     esta linea y los carteles ya impresos siguen funcionando. -->
<link rel="icon" href="/favicon-32x32.png">
<meta http-equiv="refresh" content="0; url=https://search.google.com/local/writereview?placeid=ChIJkXTuu3wJfpYRfo5u2rSGuwU">
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center;
    background:#e8f1f8;color:#1b4a6b;
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  img{width:118px;height:118px;border-radius:50%;background:#fff;padding:4px;
    box-shadow:0 8px 20px rgba(18,63,103,.18)}
  h1{font-size:19px;margin:0;font-weight:700}
  p{margin:0;font-size:14.5px;color:#3d6684;max-width:34ch}
  a{display:inline-block;margin-top:4px;background:#1b4a6b;color:#fff;text-decoration:none;
    padding:12px 22px;border-radius:11px;font-weight:700;font-size:14.5px}
</style>
</head>
<body>
  <img src="/android-chrome-512x512.png" alt="Paladear Mercado de Sabores">
  <h1>¡Gracias por dejarnos tu reseña!</h1>
  <p>Te estamos llevando a Google…</p>
  <a href="https://search.google.com/local/writereview?placeid=ChIJkXTuu3wJfpYRfo5u2rSGuwU">Escribir la reseña</a>
<script>location.replace('https://search.google.com/local/writereview?placeid=ChIJkXTuu3wJfpYRfo5u2rSGuwU');</script>
</body>
</html>
