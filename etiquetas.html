<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Etiquetas de precios · Paladear</title>
<link rel="icon" href="favicon-32x32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Etiquetas, ofertas y listas de precios para imprimir en blanco y negro.
   Pantalla como E-Codbar: productos a la izquierda, hoja a la derecha, todo
   en la primera pantalla.
   Precios: lista 1 de E-Pyme (precios-min.csv, que actualiza el robot).
   Cambios y ofertas: los del panel (catalogo-panel.json).
   Lo impreso, nombres, % de oferta y listas guardadas: etiquetas-impresas.json
   en este mismo repo, guardado con la clave del panel. */
:root{
  --azul:#123f67; --banda:#4c7192; --cielo:#e3edf2; --tinta:#1d2b38;
  --tenue:#5f7284; --linea:#dbe3e9; --papel:#eef2f5; --ok:#2f7a45; --mal:#b3261e;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:'Montserrat',system-ui,sans-serif;font-size:13px;line-height:1.35}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}

/* cabecera en una linea */
.cab{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--linea);min-width:0}
.cab h1{font-size:16px;margin:0;color:var(--azul);font-weight:800;white-space:nowrap}
.secciones{display:flex;gap:4px}
.secciones button{border:1px solid var(--linea);background:#fff;color:var(--banda);padding:6px 14px;border-radius:7px;
  font-weight:800;font-size:13px}
.secciones button[aria-selected="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.estado{flex:1;min-width:0;font-size:11.5px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.estado.mal{color:var(--mal);font-weight:700}

.cuerpo{display:grid;grid-template-columns:minmax(330px,34%) 1fr;min-height:0}

/* izquierda: selector */
.izq{display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--linea)}
.filtros{padding:10px 12px 8px;border-bottom:1px solid var(--linea);display:flex;flex-direction:column;gap:7px}
.fuentes{display:flex;gap:4px;flex-wrap:wrap}
.fuentes button{border:1px solid var(--linea);background:#fff;color:var(--banda);padding:4px 10px;border-radius:20px;font-weight:700;font-size:12px}
.fuentes button[aria-pressed="true"]{background:var(--cielo);border-color:var(--banda);color:var(--azul)}
.fila{display:flex;gap:6px;align-items:center}
.fila input[type=search]{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--linea);border-radius:7px}
.fila select,.fila input[type=date]{padding:5px 7px;border:1px solid var(--linea);border-radius:7px;max-width:52%}
.acc{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--tenue);flex-wrap:wrap}
.acc span{flex:1 1 100%;order:3}
.lista{flex:1;overflow:auto;min-height:0}
.busca{width:100%;padding:8px 10px;border:2px solid var(--banda);border-radius:8px;font-weight:600}
.busca.nada{border-color:var(--mal);background:#fdf3f2}
.prod.foco{outline:2px solid var(--azul);outline-offset:-2px;background:#dbe9f5}
.ayuda-b{font-size:11px;color:var(--tenue)}
.prod{display:grid;grid-template-columns:20px 1fr auto;gap:2px 8px;align-items:center;padding:6px 12px;border-bottom:1px solid #edf1f4;cursor:pointer}
.prod:hover{background:#f6f9fb}
.prod.en{background:#eef5fa}
.prod input{margin:0;accent-color:var(--azul);width:15px;height:15px}
.prod .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .pr{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.prod .d{grid-column:2 / -1;font-size:11px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small.tam{color:var(--banda);font-weight:700;margin-left:4px}
.chip{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:4px;background:var(--cielo);
  color:var(--banda);text-transform:uppercase;letter-spacing:.03em}
.chip.sube{background:#fdecea;color:var(--mal)} .chip.baja{background:#e6f4ea;color:var(--ok)}
.vacio{color:var(--tenue);padding:24px 14px;text-align:center}

/* derecha: opciones, vista previa e imprimir */
.der{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0}
.opc{padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:#fff;border-bottom:1px solid var(--linea);font-size:12px}
.opc select,.opc input[type=text]{padding:4px 7px;border:1px solid var(--linea);border-radius:6px}
.opc input[type=text]{width:220px}
.opc .grupo{display:flex;gap:5px;align-items:center}
input.pct{width:50px;padding:3px 5px;border:1px solid var(--linea);border-radius:6px;text-align:right}
.btn{border:1px solid var(--linea);background:#fff;color:var(--tinta);padding:5px 10px;border-radius:7px;font-weight:600;font-size:12px}
.btn:hover{border-color:var(--banda);color:var(--banda)}
.btn.prim{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.prim:hover{background:#0d3053;color:#fff}
.btn.grande{font-size:15px;font-weight:800;padding:10px 26px}
.btn:disabled{opacity:.45;cursor:default}
.vista{overflow:auto;min-height:0;padding:14px}
.pie{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border-top:1px solid var(--linea)}
.pie .res{flex:1;font-size:12.5px;color:var(--tenue)}
.pie .res b{color:var(--tinta)}

/* ── hojas A4: todo en negro ── */
.hojas{display:flex;flex-direction:column;align-items:center;gap:14px;zoom:var(--zoom,1)}
.hoja{width:210mm;height:297mm;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.15);overflow:hidden;color:#000;flex:0 0 auto}
.hoja.et-hoja{padding:13.5mm 5mm;display:grid;grid-template-columns:repeat(4,50mm);grid-auto-rows:30mm;align-content:start}
.et{width:50mm;height:30mm;border:.2mm dashed #9a9a9a;padding:2.2mm 2.6mm 1.8mm;display:flex;
  flex-direction:column;align-items:center;justify-content:space-between;text-align:center;overflow:hidden;color:#000;cursor:pointer}
.et:hover{outline:2px solid var(--banda);outline-offset:-2px}
.et-nom{font-weight:700;font-size:8.5pt;line-height:1.15;max-height:2.35em;overflow:hidden;width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.et-precio{display:flex;align-items:flex-start;justify-content:center;line-height:.95;white-space:nowrap}
.et-signo{font-size:13pt;font-weight:700;margin:1.3mm .7mm 0 0}
.et-num{font-size:32pt;font-weight:800;letter-spacing:-.02em}
.et-uni{font-size:7.5pt;font-weight:700;letter-spacing:.04em;min-height:1em}
.of-antes{display:flex;align-items:center;justify-content:center;gap:1.6mm;font-size:8.5pt;font-weight:600;white-space:nowrap}
.of-ant{font-weight:700}
.of-pct{background:#000;color:#fff;font-weight:800;font-size:7.5pt;padding:.4mm 1.4mm;border-radius:.8mm;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.of .et-num{font-size:28pt}
.hoja.li-hoja{padding:5mm;display:grid;align-content:start;justify-content:start}
.li-panel{border:.2mm dashed #9a9a9a;padding:2.5mm;display:grid;column-gap:4mm;overflow:hidden;color:#000}
.li-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:2mm;align-content:center;
  padding:0 1.6mm;cursor:pointer;min-width:0;border-bottom:.15mm solid #c8c8c8}
.li-fila.par{background:#ebebeb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.li-fila:hover{outline:1px solid var(--banda)}
.li-nom{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.li-det{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;grid-column:1}
.li-pre{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;grid-column:2;grid-row:1 / span 2;
  align-self:center;text-align:right;line-height:1}
.li-pre small{font-weight:700;font-size:.62em;margin-left:.4mm}
.sin-hojas{color:var(--tenue);text-align:center;padding:60px 20px;font-size:14px}

/* dialogos */
dialog{border:none;border-radius:12px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(440px,92vw);font-size:13px}
dialog::backdrop{background:rgba(18,30,45,.35)}
dialog h3{margin:0 0 10px;color:var(--azul);font-size:15px}
dialog label{display:block;margin:8px 0 3px;font-weight:700;font-size:12px;color:var(--tenue)}
dialog input[type=text],dialog input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--linea);border-radius:7px}
dialog .bots{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
dialog .bots .izq-b{margin-right:auto}
dialog p{margin:0 0 6px}

@media (max-width:820px){
  .app{height:auto;overflow:visible}
  .cuerpo{grid-template-columns:1fr}
  .izq{max-height:55vh}
}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{height:auto;background:#fff}
  .cab,.izq,.opc,.pie,dialog{display:none !important}
  .app,.cuerpo,.der,.vista{display:block !important;height:auto !important;overflow:visible !important;padding:0 !important;border:0 !important}
  .hojas{display:block !important;zoom:1 !important}
  .hoja{box-shadow:none;page-break-after:always;break-after:page}
  .hoja:last-child{page-break-after:auto;break-after:auto}
  .et,.li-fila{cursor:default;outline:none !important;background:none !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="cab">
    <h1>Etiquetas</h1>
    <div class="secciones" role="tablist" id="secciones">
      <button type="button" data-sec="et" aria-selected="true">Etiquetas 5×3</button>
      <button type="button" data-sec="of" aria-selected="false">Ofertas 5×3</button>
      <button type="button" data-sec="li" aria-selected="false">Listas A4</button>
    </div>
    <div class="estado" id="estado">Leyendo precios…</div>
  </header>

  <div class="cuerpo">
    <!-- izquierda: elegir productos -->
    <section class="izq">
      <div class="filtros">
        <div class="fuentes" id="fuentes"></div>
        <input type="search" class="busca" id="q" placeholder="Escribí el nombre o el código…" autocomplete="off"
          title="Escribí y la lista salta al producto. Enter lo marca, flechas para moverte.">
        <div class="ayuda-b">Escribí y salta al producto · <b>Enter</b> lo marca · <b>↑ ↓</b> para moverte</div>
        <div class="fila" id="filaDesde"><span style="font-size:12px;color:var(--tenue)">Que cambiaron desde</span>
          <input type="date" id="desde"></div>
        <div class="acc"><select id="rubro" style="padding:4px 6px;border:1px solid var(--linea);border-radius:6px;max-width:46%">
            <option value="">Todos los rubros</option></select><span id="cuenta"></span>
          <button type="button" class="btn" id="marcarTodos">Marcar todos</button>
          <button type="button" class="btn" id="desmarcarTodos">Desmarcar</button></div>
      </div>
      <div class="lista" id="lista"></div>
    </section>

    <!-- derecha: opciones, vista previa e imprimir -->
    <section class="der">
      <div class="opc">
        <div class="grupo">Guardadas: <select id="presetSel"></select>
          <button type="button" class="btn" id="presetCargar">Cargar</button>
          <button type="button" class="btn" id="presetGuardar">Guardar…</button>
          <button type="button" class="btn" id="presetBorrar">Borrar</button></div>
        <button type="button" class="btn" id="ultimaCargar" hidden></button>
        <label class="grupo"><input type="checkbox" id="porKilo" checked> «por kilo» en granel</label>
        <label class="grupo"><input type="checkbox" id="peso" checked> tamaño en envasados</label>
        <label class="grupo" id="ctlPct">Descuento general <input type="number" class="pct" id="pctGlobal" min="1" max="90" step="1"> %</label>
        <span class="grupo" id="ctlLista">
          <select id="liFormato" title="Formato de la lista"></select>
          <span class="grupo" id="liMedida">ancho <input type="number" class="pct" id="liAncho" min="3" max="20" step="0.5"> ×
            alto <input type="number" class="pct" id="liAlto" min="3" max="28.7" step="0.5"> cm</span>
          <select id="liCols" title="Columnas"><option value="auto">Columnas: auto</option><option value="1">1 columna</option>
            <option value="2">2 columnas</option><option value="3">3 columnas</option></select>
          <select id="liLetra" title="Tamaño de letra"><option value="ch">Letra chica</option><option value="me" selected>Letra mediana</option>
            <option value="gr">Letra grande</option></select>
          <label class="grupo"><input type="checkbox" id="liOrden" checked> A-Z</label>
        </span>
      </div>
      <div class="vista" id="vista"><div class="hojas" id="hojas"></div></div>
      <div class="pie">
        <div class="res" id="resumen"></div>
        <button type="button" class="btn" id="vaciar">Vaciar</button>
        <button type="button" class="btn prim grande" id="imprimir">Imprimir</button>
      </div>
    </section>
  </div>
</div>

<dialog id="dlgEditar">
  <h3 id="edTit">Etiqueta</h3>
  <p id="edInfo" style="color:var(--tenue)"></p>
  <label for="edNom">Nombre en la etiqueta</label>
  <input type="text" id="edNom">
  <div id="edPctCaja"><label for="edPct">Descuento de este producto (%)</label>
    <input type="number" id="edPct" min="1" max="90" step="1"></div>
  <div class="bots">
    <button type="button" class="btn izq-b" id="edSacar">Sacar de la hoja</button>
    <button type="button" class="btn" id="edCancelar">Cancelar</button>
    <button type="button" class="btn prim" id="edGuardar">Guardar</button>
  </div>
</dialog>
<dialog id="dlgImpreso">
  <h3>¿Salieron bien?</h3>
  <p>Si confirmás, quedan anotadas con su precio y no vuelven a aparecer en «Cambiaron» hasta que el precio
    cambie otra vez.</p>
  <div class="bots">
    <button type="button" class="btn" id="noAnotar">No, todavía no</button>
    <button type="button" class="btn prim" id="anotar">Sí, anotarlas</button>
  </div>
</dialog>

<script>
const ES_OFICIAL = location.hostname === 'paladear.com.ar' ||
  (location.hostname === 'paladear.github.io' && !/-test(\/|$)/.test(location.pathname));
const REPO = 'paladear/paladeartienda' + (ES_OFICIAL ? '' : '-test');
const ARCHIVO = 'etiquetas-impresas.json';
let TOKEN = '';
try { TOKEN = localStorage.getItem('paladear_panel_token') || ''; } catch (e) {}

const $ = id => document.getElementById(id);
const pl = n => Math.round(n).toLocaleString('es-AR');
const hoyISO = () => new Date().toISOString();
const fecha = iso => iso ? new Date(iso).toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit'}) : '';
const esKg = nom => /X\s*KG|XKG|X\s*KILO|X\s*1\s*KG/i.test(nom);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

let PRODS = [], PORCOD = {}, CAMBIOS = {}, FICHAS = {};
// presets: {seccion: {nombre: {cods, titulo, cols, f}}}; ultimas: {seccion: {cods, titulo, cols, f}}
let ESTADO = {base: null, impresas: {}, nombres: {}, ofertaGlobal: 15, ofertaPct: {}, ofertasImpresas: {},
              presets: {}, ultimas: {}};
let SHA = null;
let SEC = 'et';
// Etiquetas abre en los ultimos productos que cambiaron de precio; Ofertas en los que estan en oferta.
// El listado entero ('todos') aparece recien al tocar el buscador, como en E-Codbar.
const FUENTES = {et: [['cambios', 'Cambiaron'], ['todos', 'Todos']], of: [['ofertas', 'En oferta'], ['todos', 'Todos']],
                 li: [['ofertas', 'En oferta'], ['todos', 'Todos']]};
const FUENTE_INICIAL = {et: 'cambios', of: 'ofertas', li: 'inicio'};
let FUENTE = Object.assign({}, FUENTE_INICIAL);
let COLA = {et: [], of: [], li: []};
try { COLA = Object.assign(COLA, JSON.parse(localStorage.getItem('etiquetas_colas') || '{}')); } catch (e) {}
const guardarColas = () => { try { localStorage.setItem('etiquetas_colas', JSON.stringify(COLA)); } catch (e) {} };
// ── formatos de lista: ancho y alto en mm de cada recorte; varios entran en una A4
const FORMATOS = [
  ['t6', 'Tira angosta 6 × 28 cm', 60, 280], ['t8', 'Tira 8 × 28 cm', 80, 280],
  ['m10', 'Media hoja 10 × 28 cm', 100, 280], ['h19', 'Hoja entera 19 × 28 cm', 190, 280],
  ['f19', 'Franja ancha 19 × 9 cm', 190, 90], ['med', 'A medida…', 0, 0]];
// col: ancho minimo de cada columna en modo automatico, para que el nombre entre entero
const LETRAS = {ch: {n: 9, d: 6.8, fila: 8, col: 58}, me: {n: 11, d: 7.8, fila: 9.6, col: 78},
                gr: {n: 13.5, d: 9, fila: 11.6, col: 98}};
FORMATOS.forEach(f => $('liFormato').append(new Option(f[1], f[0])));
function leerFmtLista() {
  let o = {};
  try { o = JSON.parse(localStorage.getItem('etiquetas_li_fmt') || '{}'); } catch (e) {}
  return Object.assign({formato: 't8', ancho: 8, alto: 28, cols: 'auto', letra: 'me', orden: true}, o);
}
function ponerFmtLista(o) {
  $('liFormato').value = o.formato; $('liAncho').value = o.ancho; $('liAlto').value = o.alto;
  $('liCols').value = o.cols; $('liLetra').value = o.letra; $('liOrden').checked = o.orden !== false;
  $('liMedida').hidden = o.formato !== 'med';
}
function fmtLista() {
  return {formato: $('liFormato').value, ancho: Number($('liAncho').value) || 8, alto: Number($('liAlto').value) || 28,
          cols: $('liCols').value, letra: $('liLetra').value, orden: $('liOrden').checked};
}
ponerFmtLista(leerFmtLista());
const SEC_NOMBRE = {et: 'etiquetas', of: 'ofertas', li: 'lista'};

function avisar(txt, mal) { const e = $('estado'); e.textContent = txt; e.title = txt; e.className = 'estado' + (mal ? ' mal' : ''); }

// ── nombres y tamaños
const CHICAS = new Set(['de', 'del', 'con', 'sin', 'y', 'e', 'o', 'u', 'en', 'la', 'las', 'el', 'los', 'a', 'al',
                        'x', 'para', 'por']);
// Todos los nombres salen igual: minuscula con la primera letra de cada palabra
// en mayuscula ("JABON GLICERINA" -> "Jabon Glicerina"). Las palabras cortas de
// enlace van en minuscula y algunas siglas quedan como siglas.
const SIGLAS = new Set(['TACC', 'DHA', 'EPA', 'MCT', 'B12', 'B6', 'D3', 'K2', 'ADN', 'AFG', 'SRL', 'SA']);
function titulo(n) {
  return String(n).replace(/\s+/g, ' ').trim().split(' ').map((w, i) => {
    const limpia = w.replace(/[^\p{L}\p{N}]/gu, '');
    if (SIGLAS.has(limpia.toUpperCase()) && limpia === limpia.toUpperCase()) return w;
    const l = w.toLowerCase();
    if (i && CHICAS.has(l)) return l;
    return l.replace(/\p{L}/u, c => c.toUpperCase());
  }).join(' ');
}
function prolijo(n) {
  return titulo(n.replace(/\s+X\s*\d*\s*(KG|KILO)S?\.?\s*$/i, '').replace(/\s+XKG\.?$/i, '').replace(/\.+\s*$/, '')
                 .replace(/"+/g, ''));
}
const nombreAuto = p => titulo((FICHAS[p.cod] && FICHAS[p.cod].nombre) || prolijo(p.nom));
const nombreDe = p => titulo(ESTADO.nombres[p.cod] || nombreAuto(p));
function unidadLinda(u) {
  u = u.toLowerCase();
  if (/^k/.test(u)) return 'kg'; if (/^g/.test(u)) return 'g';
  if (u === 'cc') return 'cc'; if (u === 'ml') return 'ml'; return 'L';
}
function presentacion(p) {
  const f = FICHAS[p.cod] || {};
  if (f.envase) return String(f.envase).replace(/\s+/g, ' ').trim();
  const U = '(kg|kilos?|grs?|g|ml|cc|lts?|litros?|l)\\b';
  const m = p.nom.match(new RegExp('x\\s*(\\d+(?:[.,]\\d+)?)\\s*' + U, 'i')) ||
            p.nom.match(new RegExp('(\\d+(?:[.,]\\d+)?)\\s*' + U + '\\.?\\s*$', 'i'));
  return m ? m[1].replace('.', ',') + ' ' + unidadLinda(m[2]) : '';
}
function uniDe(p) {
  if (esKg(p.nom)) return $('porKilo').checked ? 'POR KILO' : '';
  return $('peso').checked ? presentacion(p) : '';
}
const tamTxt = p => { const t = esKg(p.nom) ? 'por kilo' : presentacion(p); return t ? ' <small class="tam">' + esc(t) + '</small>' : ''; };

// ── ofertas
const enOfertaPanel = cod => !!(FICHAS[cod] && FICHAS[cod].oferta > 0);
const pctDe = cod => ESTADO.ofertaPct[cod] || ESTADO.ofertaGlobal || 15;
const precioOferta = p => Math.round(p.p * (1 - pctDe(p.cod) / 100));   // igual que la tienda web

// ── lectura y guardado
function filasCSV(t) {
  const out = []; let f = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) { const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { f.push(c); c = ''; }
    else if (ch === '\n') { f.push(c); out.push(f); f = []; c = ''; } else if (ch !== '\r') c += ch; }
  if (c || f.length) { f.push(c); out.push(f); }
  return out;
}
const num = s => { const n = parseFloat(String(s).trim().replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const api = (ruta, op) => fetch('https://api.github.com/repos/' + REPO + '/contents/' + ruta,
  Object.assign({cache: 'no-store'}, op || {}, {headers: {Authorization: 'token ' + TOKEN, Accept: 'application/vnd.github+json'}}));

async function leerEstado() {
  if (TOKEN) {
    try {
      const r = await api(ARCHIVO + '?ref=main');
      if (r.status === 404) return;
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(); SHA = j.sha;
      ESTADO = Object.assign(ESTADO, JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ''))))));
      return;
    } catch (e) { console.warn('estado por API:', e); }
  }
  try { const r = await fetch(ARCHIVO + '?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) ESTADO = Object.assign(ESTADO, await r.json()); } catch (e) {}
  if (!TOKEN) { try { const l = JSON.parse(localStorage.getItem('etiquetas_estado') || 'null'); if (l) ESTADO = Object.assign(ESTADO, l); } catch (e) {} }
}
let guardando = Promise.resolve();
function guardarEstado(msg) { guardando = guardando.catch(() => {}).then(() => _guardar(msg)); return guardando; }
async function _guardar(msg) {
  const texto = JSON.stringify(ESTADO, null, 1);
  try { localStorage.setItem('etiquetas_estado', texto); } catch (e) {}
  if (!TOKEN) {
    avisar('Guardado solo en esta compu. Para que quede en todas, abrí esta página desde el botón del panel.', true);
    return;
  }
  const subir = async () => {
    const cuerpo = {message: msg, content: btoa(unescape(encodeURIComponent(texto))), branch: 'main'};
    if (SHA) cuerpo.sha = SHA;
    const r = await api(ARCHIVO, {method: 'PUT', body: JSON.stringify(cuerpo)});
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    SHA = (await r.json()).content.sha;
  };
  try { await subir(); }
  catch (e) {
    if (e.status !== 409 && e.status !== 422) throw e;
    const r = await api(ARCHIVO + '?ref=main'); if (r.ok) SHA = (await r.json()).sha;
    await subir();
  }
}

async function cargar() {
  try {
    const [csv, panel] = await Promise.all([
      fetch('precios-min.csv?t=' + Date.now(), {cache: 'no-store'}).then(r => r.text()),
      fetch('catalogo-panel.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json()).catch(() => ({})),
      leerEstado()]);
    filasCSV(csv).slice(1).forEach(f => {
      if (f.length < 7 || !f[2]) return;
      const p = num(f[3]); if (!p) return;
      const prod = {cod: String(num(f[6])), nom: f[2].trim(), rubro: f[5].trim(), p};
      PRODS.push(prod); PORCOD[prod.cod] = prod;
    });
    CAMBIOS = panel.cambiosPrecio || {};
    FICHAS = panel.fichas || {};
  } catch (e) { avisar('No pude leer los precios: ' + e.message, true); return; }
  ESTADO.presets = ESTADO.presets || {}; ESTADO.ultimas = ESTADO.ultimas || {};
  const d = ESTADO.base ? new Date(ESTADO.base) : new Date(Date.now() - 7 * 864e5);
  $('desde').value = d.toISOString().slice(0, 10);
  $('pctGlobal').value = ESTADO.ofertaGlobal || 15;
  [...new Set(PRODS.map(p => p.rubro))].sort()
    .forEach(r => $('rubro').append(new Option(r.charAt(0) + r.slice(1).toLowerCase(), r)));
  Object.keys(COLA).forEach(k => { COLA[k] = (COLA[k] || []).filter(c => PORCOD[c]); });
  avisar(PRODS.length + ' productos · ' + PRODS.filter(p => enOfertaPanel(p.cod)).length + ' en oferta · ' +
    Object.keys(ESTADO.impresas).length + ' etiquetas anotadas' +
    (TOKEN ? '' : ' · sin la clave del panel: lo que anotes queda solo en esta compu'));
  pintarTodo();
}

// ── listas de la izquierda
function listaCambios() {
  const desde = new Date(($('desde').value || '2000-01-01') + 'T00:00:00');
  const out = [];
  PRODS.forEach(p => {
    const imp = ESTADO.impresas[p.cod], cam = CAMBIOS[p.cod];
    if (imp) { if (imp.p !== p.p) out.push({p, antes: imp.p, cuando: cam && cam.f, imp: imp.f}); }
    else if (cam && cam.f && new Date(cam.f) >= desde && cam.n === p.p) out.push({p, antes: cam.p, cuando: cam.f});
  });
  return out.sort((a, b) => String(b.cuando || '').localeCompare(String(a.cuando || '')));
}
const listaOfertas = () => PRODS.filter(p => enOfertaPanel(p.cod));
function filasIzq() {
  const r = $('rubro').value;
  const pasa = p => !r || p.rubro === r;
  const f = FUENTE[SEC];
  if (f === 'inicio') return [];
  if (f === 'cambios') return listaCambios().filter(c => pasa(c.p));
  const base = f === 'ofertas' ? listaOfertas() : PRODS.slice().sort((a, b) => nombreDe(a).localeCompare(nombreDe(b), 'es'));
  return base.filter(pasa).map(p => ({p}));
}
function pintarIzq() {
  const fu = $('fuentes'); fu.textContent = '';
  FUENTES[SEC].forEach(([id, et]) => {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(FUENTE[SEC] === id));

    b.addEventListener('click', () => { FUENTE[SEC] = id; pintarTodo(); });

  });

    d.dataset.cod = p.cod;
    const ch = document.createElement('input'); ch.type = 'checkbox'; ch.checked = en; ch.tabIndex = -1;
    let det = esc(p.rubro.toLowerCase()) + ' · ' + p.cod;

      det = dif + ' ' + (c.antes ? 'antes $' + pl(c.antes) + ' · ' : '') + fecha(c.cuando) + (c.imp ? ' · impresa ' + fecha(c.imp) : '');

// ── buscador como E-Codbar: escribir salta al producto, Enter lo marca
let ORDEN_IZQ = [], FOCO = null;
const normal = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function alternar(cod) {
  if (COLA[SEC].includes(cod)) COLA[SEC] = COLA[SEC].filter(x => x !== cod); else COLA[SEC].push(cod);
  guardarColas(); pintarTodo(true);
}
function marcarFoco(centrar) {
  document.querySelectorAll('#lista .prod.foco').forEach(e => e.classList.remove('foco'));
  if (!FOCO) return;
  const el = document.querySelector('#lista .prod[data-cod="' + FOCO + '"]');
  if (el) { el.classList.add('foco'); if (centrar) el.scrollIntoView({block: 'center'}); }
}
function saltar(txt) {
  const t = normal(txt.trim());
  $('q').classList.remove('nada');
  if (!t) { FOCO = null; marcarFoco(); return; }
  let i = -1;
  if (/^\d+$/.test(t)) i = ORDEN_IZQ.findIndex(p => p.cod === t);
  if (i < 0) i = ORDEN_IZQ.findIndex(p => normal(nombreDe(p)).startsWith(t));
  if (i < 0) i = ORDEN_IZQ.findIndex(p => normal(nombreDe(p) + ' ' + p.nom + ' ' + p.cod).includes(t));
  if (i < 0 && FUENTE[SEC] !== 'todos') {
    FUENTE[SEC] = 'todos'; pintarTodo();
    return saltar(txt);
  }
  if (i < 0) { $('q').classList.add('nada'); return; }
  FOCO = ORDEN_IZQ[i].cod; marcarFoco(true);
}
$('q').addEventListener('input', () => saltar($('q').value));
const abrirListado = () => { if (FUENTE[SEC] !== 'todos') { FUENTE[SEC] = 'todos'; pintarTodo(); } };
['focus', 'mousedown', 'click'].forEach(ev => $('q').addEventListener(ev, abrirListado));
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (FOCO) { alternar(FOCO); marcarFoco(); } return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    let i = ORDEN_IZQ.findIndex(p => p.cod === FOCO);
    i = Math.min(ORDEN_IZQ.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)));
    if (ORDEN_IZQ[i]) { FOCO = ORDEN_IZQ[i].cod; marcarFoco(true); }
  }
});

/* Lista sin titulos: cada renglon lleva el nombre, debajo la marca y el tamaño
   (en renglon aparte para que nunca se corten) y el precio a la derecha.
   El recorte tiene el ancho y alto elegidos y entran varios por A4. */
function pintarListas(items) {
  const f = fmtLista();
  const base = FORMATOS.find(x => x[0] === f.formato) || FORMATOS[1];
  let w = base[2] || f.ancho * 10, h = base[3] || f.alto * 10;
  w = Math.min(200, Math.max(30, w)); h = Math.min(287, Math.max(30, h));
  const L = LETRAS[f.letra] || LETRAS.me;
  const cols = f.cols === 'auto' ? Math.max(1, Math.floor((w - 5) / L.col)) : Number(f.cols);
  const filasCol = Math.max(1, Math.floor((h - 5) / L.fila));
  const porPanel = filasCol * cols;
  const enFila = Math.max(1, Math.floor(200 / w)), enCol = Math.max(1, Math.floor(287 / h)), porHoja = enFila * enCol;
  if (f.orden) items = items.slice().sort((a, b) => nombreDe(a).localeCompare(nombreDe(b), 'es'));
  const paneles = [];
  for (let i = 0; i < items.length; i += porPanel) paneles.push(items.slice(i, i + porPanel));
  for (let k = 0; k < paneles.length; k += porHoja) {
    const hoja = document.createElement('div'); hoja.className = 'hoja li-hoja';
    hoja.style.gridTemplateColumns = 'repeat(' + enFila + ', ' + w + 'mm)';
    hoja.style.gridAutoRows = h + 'mm';
    paneles.slice(k, k + porHoja).forEach(grupo => {
      const pan = document.createElement('div'); pan.className = 'li-panel';
      pan.style.width = w + 'mm'; pan.style.height = h + 'mm';
      pan.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
      pan.style.gridTemplateRows = 'repeat(' + filasCol + ', ' + L.fila + 'mm)';
      pan.style.gridAutoFlow = 'column';
      grupo.forEach((p, idx) => {
        const fila = document.createElement('div');
        fila.className = 'li-fila' + ((idx % filasCol) % 2 ? ' par' : '');
        fila.title = 'Tocá para corregir';
        const nom = document.createElement('div'); nom.className = 'li-nom'; nom.textContent = nombreDe(p);
        nom.style.fontSize = L.n + 'pt';
        const marca = (FICHAS[p.cod] && FICHAS[p.cod].marca) || '';
        const tam = esKg(p.nom) ? '' : ($('peso').checked ? presentacion(p) : '');
        const det = [marca, tam].filter(Boolean);
        if (enOfertaPanel(p.cod)) det.push('oferta, antes $' + pl(p.p));
        const d = document.createElement('div'); d.className = 'li-det'; d.textContent = det.join(' · ');
        d.style.fontSize = L.d + 'pt';
        const pre = document.createElement('div'); pre.className = 'li-pre'; pre.style.fontSize = (L.n + 1) + 'pt';
        pre.textContent = '$' + pl(enOfertaPanel(p.cod) ? precioOferta(p) : p.p);
        if (esKg(p.nom) && $('porKilo').checked) { const u = document.createElement('small'); u.textContent = 'kg'; pre.append(u); }
        fila.append(nom, pre, d);
        fila.addEventListener('click', () => editar(p));
        pan.append(fila);
      });
      hoja.append(pan);
    });
    $('hojas').append(hoja);
  }
  return ' · recortes de ' + (w / 10).toString().replace('.', ',') + ' × ' + (h / 10).toString().replace('.', ',') +
    ' cm, ' + porPanel + ' productos cada uno';
}
// La hoja se achica para que entre entera a lo ancho de la vista previa.

  if (antes && ps[antes]) sel.value = antes;
  $('presetCargar').disabled = $('presetBorrar').disabled = !nombres.length;
  $('presetGuardar').disabled = !COLA[SEC].length;
  const u = ESTADO.ultimas[SEC];
  $('ultimaCargar').hidden = !(u && u.cods && u.cods.length);
  if (u) $('ultimaCargar').textContent = 'Última impresa (' + fecha(u.f) + ', ' + u.cods.length + ')';
}
$('presetGuardar').addEventListener('click', () => {
  const n = (prompt('¿Con qué nombre guardo esta lista de ' + SEC_NOMBRE[SEC] + '?\nPor ejemplo: Estantería productos de higiene personal',
                    '') || '').trim();
  if (!n) return;
  ESTADO.presets[SEC] = ESTADO.presets[SEC] || {};
  if (ESTADO.presets[SEC][n] && !confirm('Ya hay una lista guardada como «' + n + '». ¿La reemplazo?')) return;
  ESTADO.presets[SEC][n] = fotoDeLista();
  guardarEstado('Etiquetas: lista guardada «' + n + '»').then(() => avisar('Lista «' + n + '» guardada.'))
    .catch(e => avisar('No pude guardar la lista: ' + e.message, true));
  pintarPresets(); $('presetSel').value = n;
});
$('presetCargar').addEventListener('click', () => {
  const n = $('presetSel').value, l = (ESTADO.presets[SEC] || {})[n];
  if (!l) return;
  if (COLA[SEC].length && !confirm('Se reemplaza la hoja actual por la lista «' + n + '». ¿Sigo?')) return;
  aplicarLista(l); $('presetSel').value = n;
});
$('presetBorrar').addEventListener('click', () => {
  const n = $('presetSel').value;
  if (!n || !confirm('¿Borro la lista guardada «' + n + '»? Los productos no se tocan.')) return;
  delete ESTADO.presets[SEC][n];
  guardarEstado('Etiquetas: lista borrada «' + n + '»').catch(e => avisar('No pude borrar la lista: ' + e.message, true));
  pintarPresets();
});
$('ultimaCargar').addEventListener('click', () => {
  const u = ESTADO.ultimas[SEC]; if (!u) return;
  if (COLA[SEC].length && !confirm('Se reemplaza la hoja actual por la última impresa. ¿Sigo?')) return;
  aplicarLista(u);
});

// ── opciones, imprimir y anotar
['porKilo', 'peso'].forEach(id => $(id).addEventListener('change', pintarHojas));
['liFormato', 'liAncho', 'liAlto', 'liCols', 'liLetra', 'liOrden'].forEach(id => ['input', 'change'].forEach(ev =>
  $(id).addEventListener(ev, () => {
    $('liMedida').hidden = $('liFormato').value !== 'med';
    try { localStorage.setItem('etiquetas_li_fmt', JSON.stringify(fmtLista())); } catch (e) {}
    pintarHojas();
  })));
$('vaciar').addEventListener('click', () => {
  if (!confirm('¿Saco todos los productos de la hoja?')) return;
  COLA[SEC] = []; guardarColas(); pintarTodo(true);
});
$('imprimir').addEventListener('click', async () => {
  await ajustarPrecios();
  ESTADO.ultimas[SEC] = fotoDeLista();
  guardarEstado('Etiquetas: última ' + SEC_NOMBRE[SEC] + ' impresa (' + COLA[SEC].length + ')')
    .catch(e => avisar('No pude guardar la última impresa: ' + e.message, true));
  window.print();
  pintarPresets();
  if (SEC !== 'li') $('dlgImpreso').showModal();
});
$('noAnotar').addEventListener('click', () => $('dlgImpreso').close());
$('anotar').addEventListener('click', async () => {
  const ahora = hoyISO(), sec = SEC, cods = COLA[sec].slice();
  cods.forEach(cod => {
    const p = PORCOD[cod]; if (!p) return;
    if (sec === 'et') ESTADO.impresas[cod] = {p: p.p, f: ahora};
    else ESTADO.ofertasImpresas[cod] = {p: p.p, o: precioOferta(p), pct: pctDe(cod), f: ahora};
  });
  if (sec === 'et' && !ESTADO.base) ESTADO.base = ahora;
  $('anotar').disabled = true;
  try {
    await guardarEstado((sec === 'et' ? 'Etiquetas' : 'Ofertas') + ' impresas (' + cods.length + ')');
    COLA[sec] = []; guardarColas();
    $('dlgImpreso').close();
    avisar(cods.length + (sec === 'et' ? ' etiquetas' : ' ofertas') + ' anotadas.');
    pintarTodo();
  } catch (e) {
    avisar('No pude anotarlas: ' + e.message + '. Probá de nuevo.', true);
  } finally { $('anotar').disabled = false; }
});

cargar();
</script>
</body>
</html>
